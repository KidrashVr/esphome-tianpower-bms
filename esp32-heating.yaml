substitutions:
  name: tianpower-bms-ble
  bms0: "Carlotta"
  bms1: "Barbotta"
  device_description: "Monitor two Tianpower Battery Management Systems via BLE"
  external_components_source: github://KidrashVr/esphome-tianpower-bms@main
  bms0_mac_address: !secret bms0_mac_address
  bms1_mac_address: !secret bms1_mac_address
esphome:
  name: esp32-tianpower-1
  friendly_name: ESP32 TianPower-1
  comment: ${device_description}
  min_version: 2024.6.0
  project:
    name: "syssi.esphome-tianpower-bms"
    version: 2.1.0

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf

external_components:
  - source: ${external_components_source}
    refresh: 0s    

# Enable logging
logger:
#  level: DEBUG
#  logs:
#    sensor: INFO
#    esp32_ble: INFO
#    esp32_ble_tracker: INFO
#    esp32_ble_client: INFO

    # Enable Home Assistant API
api:
  encryption:
    key: "AT8Mws8xbVDmpCvmcGsNwDkKozEE9c+NIG7bpIefoJk="

ota:
  - platform: esphome
    password: "67c97ba8132ce8e8614b23a55814cd9e"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-Tianpower-1"
    password: "MRnnglLT559O"

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${bms0_mac_address}
    id: client0
  - mac_address: ${bms1_mac_address}
    id: client1

tianpower_bms_ble:
  - ble_client_id: client0
    id: bms0
    update_interval: 10s
  - ble_client_id: client1
    id: bms1
    update_interval: 10s

